name: Deploy Firebase Functions
description: Compiles and deploys Firebase Functions, optionally force-deleting functions removed from source. Authenticates via Application Default Credentials (GOOGLE_APPLICATION_CREDENTIALS) — run the write-google-credentials action first.
inputs:
  firebase_project_id:
    description: 'Firebase project ID. Falls back to .firebaserc default when omitted.'
    required: false
    default: ''
  force_delete:
    description: 'Force-delete functions removed from source instead of prompting to keep them.'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
        GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        GOOGLE_CLOUD_QUOTA_PROJECT: ${{ env.GOOGLE_CLOUD_QUOTA_PROJECT }}
      run: |
        if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
          echo -e "\033[0;31m❌ GOOGLE_APPLICATION_CREDENTIALS is not set. Run the write-google-credentials action before this one.\033[0m"
          exit 1
        fi

        # COLORING
        GREEN='\033[0;32m'
        BLUE='\033[0;34m'
        RED='\033[0;31m'
        NC='\033[0m'

        PROJECT_ID="${FIREBASE_PROJECT_ID}"

        if [[ -z "$PROJECT_ID" ]]; then
          RC_FILE=".firebaserc"
          [[ ! -f "$RC_FILE" ]] && RC_FILE="firebase/.firebaserc"
          [[ ! -f "$RC_FILE" ]] && RC_FILE="../.firebaserc"

          if [[ -f "$RC_FILE" ]]; then
            PROJECT_ID=$(grep '"default":' "$RC_FILE" | cut -d'"' -f4)
          fi
        fi

        if [[ -z "$PROJECT_ID" ]]; then
          echo -e "${RED}❌ Project ID not found. Set FIREBASE_PROJECT_ID or configure .firebaserc${NC}"
          exit 1
        fi

        ACTUAL_FORCE_DELETE="${{ inputs.force_delete }}"
        echo -e "${BLUE}🚀 Starting Firebase Functions deployment for $PROJECT_ID...${NC}"

        if [ -d "firebase/functions" ]; then
          cd firebase/functions
        elif [ -d "functions" ]; then
          cd functions
        fi

        if [ -f "tsconfig.json" ]; then
          echo -e "   • Compiling TypeScript (npx tsc)..."
          npx tsc
        fi

        if [[ "$ACTUAL_FORCE_DELETE" == "true" ]]; then
          echo -e "   • Deploying with ${BLUE}FORCE DELETE${NC} enabled..."
          expect <<EOF
            set timeout 1800
            log_user 0
            spawn firebase deploy --only functions --project $PROJECT_ID --force
            log_user 1
            expect {
              "How many days do you want to keep container images" {
                send "\r"
                exp_continue
              }
              "Error:" {
                exit 1
              }
              eof
            }
        EOF
        else
          echo -e "   • Deploying ${BLUE}WITHOUT deleting${NC} existing remote functions (using 'expect' to answer NO)..."
          expect <<EOF
            set timeout 1800
            log_user 0
            spawn firebase deploy --only functions --project $PROJECT_ID
            log_user 1
            expect {
              "Would you like to proceed with deletion?" {
                send "n\r"
                exp_continue
              }
              "How many days do you want to keep container images" {
                send "\r"
                exp_continue
              }
              "Error:" {
                exit 1
              }
              eof
            }
        EOF
        fi

        echo -e "\n${GREEN}✅ Functions deployment process finished!${NC}"
