name: Set Firebase Secrets
description: Maps a secrets_map of ENV_VAR:SECRET_NAME pairs to Firebase Functions secrets via `firebase functions:secrets:set`, looking values up from secrets_json (toJSON(secrets) from the caller) — same convention as set-nextjs-release-env. Run write-google-credentials first so GOOGLE_APPLICATION_CREDENTIALS is set.
inputs:
  secrets_map:
    description: 'Newline-separated ENV_VAR:SECRET_NAME pairs, e.g. "SUPABASE_URL: SUPABASE_URL".'
    required: true
  secrets_json:
    description: 'toJSON(secrets) from the calling workflow.'
    required: true
  firebase_project_id:
    description: 'Firebase project ID. Falls back to .firebaserc default when omitted.'
    required: false
    default: ''
  firebase_functions_dir:
    description: 'Directory containing the Firebase Functions source, relative to the repo root.'
    required: false
    default: 'functions'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SECRETS_CONTEXT: ${{ inputs.secrets_json }}
        FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
        FIREBASE_FUNCTIONS_DIR: ${{ inputs.firebase_functions_dir }}
      run: |
        set -euo pipefail

        if [ -d "firebase/functions" ]; then
          cd firebase/functions
        elif [ -d "$FIREBASE_FUNCTIONS_DIR" ]; then
          cd "$FIREBASE_FUNCTIONS_DIR"
        fi

        PROJECT_ID="${FIREBASE_PROJECT_ID}"
        if [[ -z "$PROJECT_ID" ]]; then
          RC_FILE=".firebaserc"
          [[ ! -f "$RC_FILE" ]] && RC_FILE="../.firebaserc"
          [[ -f "$RC_FILE" ]] && PROJECT_ID=$(grep '"default":' "$RC_FILE" | cut -d'"' -f4)
        fi
        if [[ -z "$PROJECT_ID" ]]; then
          echo "❌ Project ID not found. Set firebase_project_id or configure .firebaserc" >&2
          exit 1
        fi

        MISSING=0

        while IFS=':' read -r env_var secret_name; do
          env_var=$(echo "$env_var" | xargs)
          secret_name=$(echo "$secret_name" | xargs)

          if [[ -n "$secret_name" && -n "$env_var" ]]; then
            secret_value=$(echo "$SECRETS_CONTEXT" | jq -r --arg key "$secret_name" '.[$key]')

            if [[ "$secret_value" == "null" || -z "$secret_value" ]]; then
              echo "❌ Missing value for $env_var: secret '$secret_name' is empty or not set. Check the repo secret and this workflow's secrets_map." >&2
              MISSING=1
              continue
            fi

            echo "Setting Firebase secret: $env_var (source=$secret_name, project=$PROJECT_ID)"
            echo -n "$secret_value" | firebase functions:secrets:set "$env_var" --project "$PROJECT_ID" --data-file - --force
          fi
        done <<< "${{ inputs.secrets_map }}"

        if [[ "$MISSING" == "1" ]]; then
          exit 1
        fi
