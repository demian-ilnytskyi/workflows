name: Run Next.js Tests with Coverage
description: Runs vitest with coverage (if a test script exists) and enforces a minimum per-file and overall line coverage threshold.
inputs:
  working_directory:
    required: false
    default: '.'
  test_path:
    required: false
    default: 'src/__tests__'
  min_coverage:
    required: false
    default: '50'
  per_file_exceptions:
    description: >
      Newline-separated "relative/path.ts:min%" overrides for files that
      can't meet min_coverage (e.g. confirmed-unreachable defensive code).
      Mirrors vitest.config.ts's own per-file threshold exceptions so CI
      and local coverage runs agree.
    required: false
    default: ''
  min_overall_coverage:
    description: >
      Minimum aggregate line coverage %. Defaults to min_coverage. Set this
      lower than min_coverage when per_file_exceptions lowers some files'
      floors below min_coverage, since that necessarily lowers the maximum
      achievable aggregate too.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        if jq -e '.scripts.test' package.json >/dev/null 2>&1; then
          echo "Running npm test with coverage on path ${{ inputs.test_path }}..."
          if ! npx vitest run ${{ inputs.test_path }} --coverage --coverage.reporter=json-summary --coverage.reporter=text --coverage.reporter=lcov; then
            echo "❌ Tests failed!"
            exit 1
          fi

          SUMMARY_FILE="coverage/coverage-summary.json"
          if [ ! -f "$SUMMARY_FILE" ]; then
            echo "❌ Coverage summary file not found at $SUMMARY_FILE!"
            exit 1
          fi

          OVERALL_LINE_PCT=$(jq -r '.total.lines.pct' "$SUMMARY_FILE")
          OVERALL_LINE_INT=${OVERALL_LINE_PCT%.*}

          echo ""
          echo "==============================================="
          echo "📋 Per-File Coverage Check (Line Coverage)"
          echo "==============================================="
          printf "%-45s | %-10s | %s\n" "File" "Line Cov." "Status"
          printf '%0.s-' {1..70}; echo ""

          MIN_COVERAGE_REQUIRED="${{ inputs.min_coverage }}"
          ANY_BELOW=false

          declare -A EXCEPTIONS
          while IFS=':' read -r ex_path ex_pct; do
            [ -z "$ex_path" ] && continue
            EXCEPTIONS["$ex_path"]="$ex_pct"
          done <<< "${{ inputs.per_file_exceptions }}"

          while IFS=$'\t' read -r filepath pct; do
            relpath=$(echo "$filepath" | sed "s|.*/${{ inputs.working_directory }}/src/||")
            pct_int=${pct%.*}

            if [ -z "$pct_int" ] || ! [[ "$pct_int" =~ ^[0-9]+$ ]]; then
              continue
            fi

            file_min="$MIN_COVERAGE_REQUIRED"
            if [ -n "${EXCEPTIONS[$relpath]:-}" ]; then
              file_min="${EXCEPTIONS[$relpath]}"
            fi
            file_min_int=${file_min%.*}

            if [ "$pct_int" -lt "$file_min_int" ]; then
              ANY_BELOW=true
              printf "%-45s | %-10s | ❌ below %s%%\n" "$relpath" "${pct}%" "$file_min"
            else
              printf "%-45s | %-10s | ✅\n" "$relpath" "${pct}%"
            fi
          done < <(jq -r 'to_entries[] | select(.key != "total") | "\(.key)\t\(.value.lines.pct)"' "$SUMMARY_FILE")

          printf '%0.s-' {1..70}; echo ""
          printf "%-45s | %s%%\n" "OVERALL" "${OVERALL_LINE_PCT}"
          echo ""

          MIN_OVERALL_REQUIRED="${{ inputs.min_overall_coverage }}"
          if [ -z "$MIN_OVERALL_REQUIRED" ]; then
            MIN_OVERALL_REQUIRED="$MIN_COVERAGE_REQUIRED"
          fi
          MIN_OVERALL_REQUIRED_INT=${MIN_OVERALL_REQUIRED%.*}

          if [ -z "$OVERALL_LINE_INT" ]; then
            echo "❌ Could not parse overall coverage."
            exit 1
          elif [ "$OVERALL_LINE_INT" -lt "$MIN_OVERALL_REQUIRED_INT" ]; then
            echo "❌ Overall line coverage (${OVERALL_LINE_PCT}%) is below the required ${MIN_OVERALL_REQUIRED}%."
            ANY_BELOW=true
          else
            echo "✅ Success! Line coverage is at ${OVERALL_LINE_PCT}% (minimum required is ${MIN_OVERALL_REQUIRED}%)."
          fi

          if [ "$ANY_BELOW" = true ]; then
            exit 1
          fi
        else
          echo "No test script found in package.json. Skipping."
        fi
