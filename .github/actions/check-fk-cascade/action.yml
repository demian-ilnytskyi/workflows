name: Check Foreign Key Cascade Rules
description: Fails CI if any public-schema foreign key is missing ON UPDATE CASCADE or ON DELETE CASCADE, unless its table is listed in the skip file.
inputs:
  skip_file:
    description: 'Path to newline-separated list of table names to skip'
    required: false
    default: 'supabase/data-base/fk_cascade_skip.txt'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        SKIP_FILE="${{ inputs.skip_file }}"
        if [ ! -f "$SKIP_FILE" ]; then
          if [ -f "supabase/data-base/fk_cascade_skip.txt" ]; then
            SKIP_FILE="supabase/data-base/fk_cascade_skip.txt"
          elif [ -f "supabase/migrations/fk_cascade_skip.txt" ]; then
            SKIP_FILE="supabase/migrations/fk_cascade_skip.txt"
          fi
        fi

        SKIP_LIST="''"
        if [ -f "$SKIP_FILE" ]; then
          PARSED_ITEMS=$(grep -v '^[[:space:]]*#' "$SKIP_FILE" 2>/dev/null | grep -v '^[[:space:]]*$' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' || true)
          if [ -n "$PARSED_ITEMS" ]; then
            EXPANDED_LIST=""
            while IFS= read -r tbl; do
              [ -n "$tbl" ] || continue
              clean_tbl="${tbl#public.}"
              [ -n "$EXPANDED_LIST" ] && EXPANDED_LIST="$EXPANDED_LIST, "
              EXPANDED_LIST="$EXPANDED_LIST'$tbl', 'public.$clean_tbl', '$clean_tbl'"
            done <<< "$PARSED_ITEMS"
            [ -n "$EXPANDED_LIST" ] && SKIP_LIST="$EXPANDED_LIST"
          fi
        fi

        echo "=== Checking foreign key cascade rules ==="

        {
          echo "SELECT"
          echo "  conrelid::regclass::text AS table_name,"
          echo "  conname,"
          echo "  confupdtype,"
          echo "  confdeltype"
          echo "FROM pg_constraint"
          echo "WHERE contype = 'f'"
          echo "  AND connamespace = 'public'::regnamespace"
          echo "  AND conrelid::regclass::text NOT IN ($SKIP_LIST)"
          echo "  AND ('public.' || substring(conrelid::regclass::text from '[^.]+$')) NOT IN ($SKIP_LIST)"
          echo "  AND substring(conrelid::regclass::text from '[^.]+$') NOT IN ($SKIP_LIST)"
          echo "  AND (confupdtype <> 'c' OR confdeltype <> 'c')"
          echo "ORDER BY table_name, conname;"
        } > /tmp/fk_cascade_query.sql

        set +e
        RAW_OUTPUT=$(docker exec -i "supabase-test-db" psql -U postgres -d postgres -t -A -F '|' < /tmp/fk_cascade_query.sql 2>&1)
        PSQL_EXIT=$?
        set -e

        if [ $PSQL_EXIT -ne 0 ]; then
          echo "❌ Error: Failed to query pg_constraint!"
          echo "$RAW_OUTPUT"
          exit 1
        fi

        ROWS=$(echo "$RAW_OUTPUT" | grep -v '^[[:space:]]*$' | grep -v '^NOTICE:' | grep -v '^SET' | grep -v '^WARNING:' || true)

        if [ -n "$ROWS" ]; then
          echo "❌ Foreign keys missing ON UPDATE CASCADE / ON DELETE CASCADE:"
          echo ""
          echo "$ROWS" | while IFS='|' read -r table_name conname confupdtype confdeltype; do
            echo "  - $table_name.$conname (update=$confupdtype, delete=$confdeltype)"
          done
          echo ""
          echo "Fix the constraint, or add the table name to $SKIP_FILE to intentionally skip it."
          exit 1
        else
          echo "✅ Success! All public foreign keys cascade on update and delete."
        fi
