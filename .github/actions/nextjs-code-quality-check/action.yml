name: Next.js Code Quality Check
description: Runs TypeScript type checking and ESLint, summarizing errors/warnings/info and failing CI only on real errors.
inputs:
  working_directory:
    required: false
    default: '.'
  tsconfig_path:
    required: false
    default: 'tsconfig.json'
  eslint_dir:
    required: false
    default: 'src'
  ignore_patterns:
    required: false
    default: 'public/images'
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        # =========================================
        # Colors
        # =========================================
        RED='\033[0;31m'
        YELLOW='\033[1;33m'
        BLUE='\033[0;34m'
        GREEN='\033[0;32m'
        NC='\033[0m'

        echo -e "${BLUE}========================================${NC}"
        echo -e "${BLUE}   🔍 Project Code Quality Inspection   ${NC}"
        echo -e "${BLUE}========================================\n"

        HAS_ERRORS=0
        HAS_WARNINGS=0
        HAS_INFO=0

        ###############################################
        # 1. TypeScript CHECK
        ###############################################
        echo -e "▶ ${BLUE}[1/2] TypeScript Type Checking${NC}"
        echo -e "──────────────────────────────────────────\n"

        # Run tsc without emitting files
        # Using github.workspace to support paths relative to the repo root
        # Added || true to prevent script from crashing before summary if errors exist
        TS_RAW_OUTPUT=$(npx tsc --noEmit --pretty false -p ${{ github.workspace }}/${{ inputs.working_directory }}/${{ inputs.tsconfig_path }} 2>&1 || true)

        # Filter out any errors/warnings containing the ignore patterns
        TS_OUTPUT_FILTERED=$(echo "$TS_RAW_OUTPUT" | grep -v -E "${{ inputs.ignore_patterns }}" || true)

        # Count errors/warnings/info
        TS_ERROR_COUNT=$(echo "$TS_OUTPUT_FILTERED" | grep -c "error TS" || true)
        TS_WARNING_COUNT=$(echo "$TS_OUTPUT_FILTERED" | grep -c "warning" || true)
        TS_INFO_COUNT=$(echo "$TS_OUTPUT_FILTERED" | grep -c "TS6133" || true) # unused vars

        if [ $TS_ERROR_COUNT -gt 0 ]; then HAS_ERRORS=1; fi
        if [ $TS_WARNING_COUNT -gt 0 ]; then HAS_WARNINGS=1; fi
        if [ $TS_INFO_COUNT -gt 0 ]; then HAS_INFO=1; fi

        # Display filtered TypeScript output
        if [ $TS_ERROR_COUNT -gt 0 ]; then
            echo -e "${RED}❌ TypeScript Errors:${NC}"
            echo "$TS_OUTPUT_FILTERED" | grep "error TS" || true
            echo ""
        fi

        if [ $TS_WARNING_COUNT -gt 0 ]; then
            echo -e "${YELLOW}⚠ TypeScript Warnings:${NC}"
            echo "$TS_OUTPUT_FILTERED" | grep "warning" || true
            echo ""
        fi

        if [ $TS_INFO_COUNT -gt 0 ]; then
            echo -e "${BLUE}ℹ TypeScript Info (unused vars):${NC}"
            echo "$TS_OUTPUT_FILTERED" | grep "TS6133" || true
            echo ""
        fi

        if [ $TS_ERROR_COUNT -eq 0 ] && [ $TS_WARNING_COUNT -eq 0 ] && [ $TS_INFO_COUNT -eq 0 ]; then
            echo -e "${GREEN}✅ TypeScript: No errors, warnings, or info found${NC}\n"
        fi

        ###############################################
        # 2. ESLint CHECK
        ###############################################
        echo -e "▶ ${BLUE}[2/2] Running ESLint${NC}"
        echo -e "──────────────────────────────────────────\n"

        # Using github.workspace to support paths relative to the repo root
        # Added || true to prevent script from crashing before summary if errors exist
        ESLINT_OUTPUT=$(npx eslint ${{ github.workspace }}/${{ inputs.working_directory }}/${{ inputs.eslint_dir }} --format=stylish 2>&1 || true)

        # Filter out the ignore patterns
        ESLINT_OUTPUT_FILTERED=$(echo "$ESLINT_OUTPUT" | grep -v -E "${{ inputs.ignore_patterns }}" || true)

        # Count ESLint errors/warnings/info
        ESLINT_ERROR_COUNT=$(echo "$ESLINT_OUTPUT_FILTERED" | grep -c "error" || true)
        ESLINT_WARNING_COUNT=$(echo "$ESLINT_OUTPUT_FILTERED" | grep -c "warning" || true)
        ESLINT_INFO_COUNT=$(echo "$ESLINT_OUTPUT_FILTERED" | grep -c "no-unused-vars" || true)

        if [ $ESLINT_ERROR_COUNT -gt 0 ]; then HAS_ERRORS=1; fi
        if [ $ESLINT_WARNING_COUNT -gt 0 ]; then HAS_WARNINGS=1; fi
        if [ $ESLINT_INFO_COUNT -gt 0 ]; then HAS_INFO=1; fi

        # Print ESLint output
        if [ -n "$ESLINT_OUTPUT_FILTERED" ]; then
            while IFS= read -r line; do
                if [[ $line == *"error"* ]] || [[ $line == *"✖"* ]]; then
                    echo -e "${RED}$line${NC}"
                elif [[ $line == *"warning"* ]]; then
                    echo -e "${YELLOW}$line${NC}"
                elif [[ $line == *"no-unused-vars"* ]]; then
                    echo -e "${BLUE}$line${NC}"
                else
                    echo "$line"
                fi
            done <<< "$ESLINT_OUTPUT_FILTERED"
        else
            echo -e "${GREEN}✅ ESLint: No issues or info found${NC}"
        fi

        echo ""

        ###############################################
        # SUMMARY
        ###############################################
        echo -e "${BLUE}========================================${NC}"
        echo -e "${BLUE}               Summary                  ${NC}"
        echo -e "${BLUE}========================================${NC}"

        if [ $HAS_ERRORS -eq 1 ]; then
            echo -e "${RED}❌ Errors found${NC}"
        fi

        if [ $HAS_WARNINGS -eq 1 ]; then
            echo -e "${YELLOW}⚠ Warnings found${NC}"
        fi

        if [ $HAS_INFO -eq 1 ]; then
            echo -e "${BLUE}ℹ Info found (unused imports/vars)${NC}"
        fi

        echo ""

        # Fail pipeline only if there are real errors
        if [ $HAS_ERRORS -eq 1 ]; then
            echo -e "${RED}❌ ERROR.${NC}"
            exit 1
        else
            echo -e "${GREEN}✅ No errors found.${NC}"
            exit 0
        fi
