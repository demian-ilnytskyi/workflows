name: Firebase Deploy Functions

env:
  GITHUB_OUTPUT: ${{github.workspace}}/.github/workflows/output.txt
permissions:
  id-token: write # This is required for requesting the JWT
  contents: write # This is required for actions/checkout 

on:
  workflow_call:
    inputs:
      FLAVOUR:
        required: false
        type: string
      runs_on:
        required: false
        type: string
        default: "ubuntu-latest"
      FUNCTIONS:
        required: false
        type: string
        default: ""
      FIREBASE_FUNCTIONS_DIR:
        required: false
        type: string
        default: "functions"
      FORCE_DELETE:
        description: "Force deletion of functions not in local source"
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ${{inputs.runs_on}} # We are using ubuntu to deploy flutter web
    timeout-minutes: 10
    environment: ${{inputs.FLAVOUR}} 
    steps:
    - uses: actions/checkout@v4

    - name: Check required secrets
      uses: demian-ilnytskyi/workflows/.github/actions/check-required-vars@main
      with:
        vars: |
          GOOGLE_APPLICATION_CREDENTIALS_JSON
          FIREBASE_PROJECT_ID
      env:
        GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: ${{ inputs.FIREBASE_FUNCTIONS_DIR }}/package-lock.json

    - name: Install dependencies
      working-directory: ${{ inputs.FIREBASE_FUNCTIONS_DIR }}
      run: |
        sudo apt-get update && sudo apt-get install -y expect
        npm install -g firebase-tools
        npm ci

    - name: Write Google credentials
      uses: demian-ilnytskyi/workflows/.github/actions/write-google-credentials@main
      with:
        google_application_credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        firebase_project_id: ${{ vars.FIREBASE_PROJECT_ID }}

    # No-op for callers that don't define these secrets — only runs when the
    # repo actually has SUPABASE_URL / SUPABASE_SERVICE_KEY set.
    - name: Set SUPABASE_URL Firebase secret
      if: ${{ secrets.SUPABASE_URL != '' }}
      uses: demian-ilnytskyi/workflows/.github/actions/set-firebase-secret@main
      with:
        name: SUPABASE_URL
        value: ${{ secrets.SUPABASE_URL }}
        firebase_project_id: ${{ vars.FIREBASE_PROJECT_ID }}
        firebase_functions_dir: ${{ inputs.FIREBASE_FUNCTIONS_DIR }}

    - name: Set SUPABASE_SERVICE_KEY Firebase secret
      if: ${{ secrets.SUPABASE_SERVICE_KEY != '' }}
      uses: demian-ilnytskyi/workflows/.github/actions/set-firebase-secret@main
      with:
        name: SUPABASE_SERVICE_KEY
        value: ${{ secrets.SUPABASE_SERVICE_KEY }}
        firebase_project_id: ${{ vars.FIREBASE_PROJECT_ID }}
        firebase_functions_dir: ${{ inputs.FIREBASE_FUNCTIONS_DIR }}

    - name: Deploy Functions
      uses: demian-ilnytskyi/workflows/.github/actions/deploy-firebase-functions@main
      with:
        firebase_project_id: ${{ vars.FIREBASE_PROJECT_ID }}
        force_delete: ${{ inputs.FORCE_DELETE }}
  notify:
    if: always() # Ensures this job runs regardless of the completion status of dependent jobs
    needs:
      - deploy
    uses: ./.github/workflows/notification.yml
    secrets: inherit
    with:
      job_status: ${{ needs.deploy.result }}
      workflow: ${{ github.workflow }}
      runs_on: ${{inputs.runs_on}}
