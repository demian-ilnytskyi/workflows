name: Firebase Deploy Functions

env:
  GITHUB_OUTPUT: ${{github.workspace}}/.github/workflows/output.txt
permissions:
  id-token: write # This is required for requesting the JWT
  contents: write # This is required for actions/checkout 

on:
  workflow_call:
    inputs:
      FLAVOUR:
        required: false
        type: string
      runs_on:
        required: false
        type: string
        default: "ubuntu-latest"
      FUNCTIONS:
        required: false
        type: string
        default: ""
      FIREBASE_FUNCTIONS_DIR:
        required: false
        type: string
        default: "functions"
      FORCE_DELETE:
        description: "Force deletion of functions not in local source"
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ${{inputs.runs_on}} # We are using ubuntu to deploy flutter web
    timeout-minutes: 10
    environment: ${{inputs.FLAVOUR}} 
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: ${{ inputs.FIREBASE_FUNCTIONS_DIR }}/package-lock.json

    - name: Install dependencies
      working-directory: ${{ inputs.FIREBASE_FUNCTIONS_DIR }}
      run: |
        sudo apt-get update && sudo apt-get install -y expect
        npm install -g firebase-tools
        npm ci

    - name: Deploy Functions
      working-directory: ${{ inputs.FIREBASE_FUNCTIONS_DIR }}
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      run: |
        # COLORING
        GREEN='\033[0;32m'
        BLUE='\033[0;34m'
        RED='\033[0;31m'
        NC='\033[0m'

        PROJECT_ID="${FIREBASE_PROJECT_ID}"

        if [[ -z "$PROJECT_ID" ]]; then
          RC_FILE=".firebaserc"
          [[ ! -f "$RC_FILE" ]] && RC_FILE="firebase/.firebaserc"
          [[ ! -f "$RC_FILE" ]] && RC_FILE="../.firebaserc"
          
          if [[ -f "$RC_FILE" ]]; then
            PROJECT_ID=$(grep '"default":' "$RC_FILE" | cut -d'"' -f4)
          fi
        fi

        if [[ -z "$PROJECT_ID" ]]; then
          echo -e "${RED}❌ Project ID not found. Set FIREBASE_PROJECT_ID or configure .firebaserc${NC}"
          exit 1
        fi

        ACTUAL_FORCE_DELETE="${{ inputs.FORCE_DELETE }}"
        echo -e "${BLUE}🚀 Starting Firebase Functions deployment for $PROJECT_ID...${NC}"

        if [ -d "firebase/functions" ]; then
          cd firebase/functions
        elif [ -d "functions" ]; then
          cd functions
        fi

        if [ -f "tsconfig.json" ]; then
          echo -e "   • Compiling TypeScript (npx tsc)..."
          npx tsc
        fi

        if [[ "$ACTUAL_FORCE_DELETE" == "true" ]]; then
          echo -e "   • Deploying with ${BLUE}FORCE DELETE${NC} enabled..."
          (set +x; firebase deploy --only functions --project "$PROJECT_ID" --force ${FIREBASE_TOKEN:+--token "$FIREBASE_TOKEN"})
        else
          echo -e "   • Deploying ${BLUE}WITHOUT deleting${NC} existing remote functions (using 'expect' to answer NO)..."
          expect <<EOF
            set timeout 1800
            log_user 0
            spawn firebase deploy --only functions --project $PROJECT_ID ${FIREBASE_TOKEN:+--token "$FIREBASE_TOKEN"}
            log_user 1
            expect {
              "Would you like to proceed with deletion?" {
                send "n\r"
                exp_continue
              }
              "Error:" {
                exit 1
              }
              eof
            }
        EOF
        fi

        echo -e "\n${GREEN}✅ Functions deployment process finished!${NC}"
  notify:
    if: always() # Ensures this job runs regardless of the completion status of dependent jobs
    needs:
      - deploy
    uses: ./.github/workflows/notification.yml
    secrets: inherit
    with:
      job_status: ${{ needs.deploy.result }}
      workflow: ${{ github.workflow }}
      runs_on: ${{inputs.runs_on}}
