name: CI - Build and Test

on:
  workflow_call:
    inputs:
      analyze_directories:
        required: false
        type: string
        default: "lib test"
      concurrency:
        required: false
        type: number
        default: 4
      coverage_excludes:
        required: false
        type: string
        default: ""
      flutter_channel:
        required: false
        type: string
        default: "stable"
      format_directories:
        required: false
        type: string
        default: "lib test"
      format_exclude:
        required: false
        type: string
        default: ""
      format_line_length:
        required: false
        type: string
        default: "80"
      min_coverage:
        required: false
        type: number
        default: 100
      runs_on:
        required: false
        type: string
        default: "ubuntu-latest"
      test_optimization:
        required: false
        type: boolean
        default: true
      test_recursion:
        required: false
        type: boolean
        default: false
      working_directory:
        required: false
        type: string
        default: "."
      run_build:
        required: false
        type: boolean
        default: false
      flutter_versions:
        required: false
        type: string
        default: ""
      project_type:
        required: false
        type: string
        default: "flutter"
      test_path:
        required: false
        type: string
        default: "src/__tests__"
      tsconfig_path:
        required: false
        type: string
        default: "tsconfig.json"
      eslint_dir:
        required: false
        type: string
        default: "src"
      ignore_patterns:
        required: false
        type: string
        default: "public/images"
env:
  GITHUB_OUTPUT: ${{github.workspace}}/.github/workflows/output.txt
permissions:
  contents: read

jobs:
  define-flutter-versions:
      if: ${{ inputs.project_type == 'flutter' }}
      runs-on: ${{inputs.runs_on}}

      outputs:
        flutter-versions: ${{ steps.flutter-versions.outputs.flutter-versions }}

      steps:
        - name: Define Flutter Versions
          id: flutter-versions
          env:
            flutter_version: ${{ inputs.flutter_versions || vars.FLUTTER_FRAMEWORK_VERSION }}
          run: |
            VERSION="${{env.flutter_version}}"
            IFS=', ' read -r -a VERSION_ARRAY <<< "$VERSION"

            VERSION="${{ env.flutter_version }}"
            IFS=', ' read -r -a VERSION_ARRAY <<< "$VERSION"
            VERSIONS="["
            for version in "${VERSION_ARRAY[@]}"; do
              VERSIONS="${VERSIONS}\"$version\", "
            done
            VERSIONS="${VERSIONS%, }]"
            echo "flutter versions = $VERSIONS"
            echo "flutter-versions=$VERSIONS" >> "$GITHUB_OUTPUT"
  build:
    if: ${{ inputs.project_type == 'flutter' }}
    runs-on: ${{inputs.runs_on}}
    needs: define-flutter-versions
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{inputs.working_directory}}
    strategy:
      matrix:
        flutter_versions: ${{ fromJSON(needs.define-flutter-versions.outputs.flutter-versions) }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4.1.1

      - name: 🎯 Setup Flutter (Version - ${{ matrix.flutter_versions }})
        uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: ${{ matrix.flutter_versions }}
          channel: ${{ inputs.flutter_channel }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          architecture: x64

      - name: 📦 Install Dependencies
        run: flutter pub get
        
      - name: 🏗️ Build Dependencies
        if: ${{ inputs.run_build }}
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🚀 Install Very Good CLI
        run: flutter pub global activate very_good_cli

      - name: ✨ Check Formatting
        run: |
          exclude_patterns="${{ inputs.format_exclude }}"
          find_cmd="find lib test -name '*.dart'"
          for pattern in $exclude_patterns; do
            find_cmd+=" ! -path '$pattern'"
          done
          eval "$find_cmd" | xargs dart format --line-length ${{ inputs.format_line_length }} --set-exit-if-changed

      - name: 🕵️ Analyze
        run: flutter analyze ${{ inputs.analyze_directories }}

      - name: 🧪 Run Tests
        run: |
          if [[ "$(echo ${{ matrix.flutter_versions }} | cut -d'.' -f1-2)" < "3.16" ]]; then
            flutter test --coverage --test-randomize-ordering-seed random
          else
            very_good test -j ${{ inputs.concurrency }} \
            ${{ inputs.test_recursion && '--recursive' || '' }} \
            ${{ inputs.test_optimization && '--optimization' || '--no-optimization' }} \
            --coverage --test-randomize-ordering-seed random
          fi

      - name: 📊 Check Code Coverage
        uses: VeryGoodOpenSource/very_good_coverage@main
        with:
          path: ${{ inputs.working_directory }}/coverage/lcov.info
          exclude: ${{ inputs.coverage_excludes }}
          min_coverage: ${{ inputs.min_coverage }}

  build-nextjs:
    if: ${{ inputs.project_type == 'nextjs' }}
    runs-on: ${{inputs.runs_on}}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{inputs.working_directory}}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4.1.1

      - name: 🎯 Setup Node.js
        uses: actions/setup-node@main
        with:
          node-version: ${{ vars.NODE_FRAMEWORK_VERSION }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔍 Code Quality Check
        uses: demian-ilnytskyi/workflows/.github/actions/nextjs-code-quality-check@main
        with:
          working_directory: ${{ inputs.working_directory }}
          tsconfig_path: ${{ inputs.tsconfig_path }}
          eslint_dir: ${{ inputs.eslint_dir }}
          ignore_patterns: ${{ inputs.ignore_patterns }}

      - name: 🧪 Run Tests
        uses: demian-ilnytskyi/workflows/.github/actions/run-nextjs-tests-with-coverage@main
        with:
          working_directory: ${{ inputs.working_directory }}
          test_path: ${{ inputs.test_path }}
          min_coverage: ${{ inputs.min_coverage }}

  notify:
    if: always() # Ensures this job runs regardless of the completion status of dependent jobs
    needs:
      - build
      - build-nextjs
    uses: ./.github/workflows/notification.yml
    secrets: inherit
    with:
      job_status: ${{ inputs.project_type == 'flutter' && needs.build.result || needs.build-nextjs.result }}
      workflow: ${{ github.workflow }}
      runs_on: ${{inputs.runs_on}}