# release_build.yaml
name: Next JS Build

# Controls when the workflow will run
on:
  workflow_call:
    inputs:
      FLAVOUR:
        required: true
        type: string
        default: "production"
      runs_on:
        required: false
        type: string
        default: "ubuntu-latest"
      folder_max_mb_size:
        required: false
        type: number
        default: 3
      secrets_map:
        required: false
        type: string
        default: ""
      set_as_env:
        required: false
        type: string
        default: ""

      working_directory:
        required: false
        type: string
        default: "."
      accountId:
        required: false
        type: string
        default: ""
      send_notifications:
        description: 'Set to true to send Slack notifications'
        required: false
        type: boolean
        default: true

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  build:
    runs-on: ${{inputs.runs_on}} # We are using ubuntu to deploy flutter web
    timeout-minutes: 20
    environment: ${{inputs.FLAVOUR}}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set Up Node.js
        uses: actions/setup-node@main
        with:
          node-version: ${{ vars.NODE_FRAMEWORK_VERSION }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          # See here for caching with `yarn`, `bun` or other package managers https://github.com/actions/cache/blob/main/examples.md or you can leverage caching with actions/setup-node https://github.com/actions/setup-node
          path: |
            ~/.npm
            ${{ inputs.working_directory }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles(format('{0}/package-lock.json', inputs.working_directory)) }}-${{ hashFiles(format('{0}/**/*.js', inputs.working_directory), format('{0}/**/*.jsx', inputs.working_directory), format('{0}/**/*.ts', inputs.working_directory), format('{0}/**/*.tsx', inputs.working_directory)) }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles(format('{0}/package-lock.json', inputs.working_directory)) }}-

      - name: 📦 Install Dependencies
        # npm ci instead of npm install to not overwrite package_lock.json
        run: npm install

      - name: Set env
        id: prepare_env # An ID is required to reference its output
        uses: demian-ilnytskyi/workflows/.github/actions/set-nextjs-release-env@main
        with:
          flavour: ${{ inputs.FLAVOUR }}
          secrets_map: ${{ inputs.secrets_map }}
          set_as_env: ${{ inputs.set_as_env }}
          secrets_json: ${{ toJSON(secrets) }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ inputs.accountId || secrets.CLOUDFLARE_ACCOUNT_ID }}
          working_directory: ${{ inputs.working_directory }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{secrets.CLOUDFLARE_API_TOKEN}}
          accountId: ${{ inputs.accountId || secrets.CLOUDFLARE_ACCOUNT_ID}}
          workingDirectory: ${{ inputs.working_directory }}
          command: deploy
          packageManager: npm
          environment: ${{ inputs.FLAVOUR != 'production' && inputs.FLAVOUR || '' }}
          preCommands: npm run pre-deploy && chmod +x ./check_app_size.sh && ./check_app_size.sh
  notify:
    if: always() && inputs.send_notifications == true # Ensures this job runs regardless of the completion status of dependent jobs
    needs:
      - build
    uses: ./.github/workflows/notification.yml
    secrets: inherit
    with:
      job_status: ${{ needs.build.result }}
      workflow: ${{ github.workflow }}
      runs_on: ${{inputs.runs_on}}
      trigger_actor: ${{ github.actor }}
      pr_title: ${{ github.event.pull_request.title }}
