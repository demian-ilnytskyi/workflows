# release_build.yaml
name: Next JS Build

# Controls when the workflow will run
on:
  workflow_call:
    inputs:
      FLAVOUR:
        required: true
        type: string
        default: "production"
      runs_on:
        required: false
        type: string
        default: "ubuntu-latest"
      folder_max_mb_size:
        required: false
        type: number
        default: 3
      secrets_map:
        required: false
        type: string
        default: ""
      set_as_env:
        required: false
        type: string
        default: ""

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  build:
    runs-on: ${{inputs.runs_on}} # We are using ubuntu to deploy flutter web
    timeout-minutes: 20
    environment: ${{inputs.FLAVOUR}}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Check required secrets
        uses: demian-ilnytskyi/workflows/.github/actions/check-required-vars@main
        with:
          vars: |
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Up Node.js
        uses: actions/setup-node@main
        with:
          node-version: ${{ vars.NODE_FRAMEWORK_VERSION }}
          cache: npm
      
      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          # See here for caching with `yarn`, `bun` or other package managers https://github.com/actions/cache/blob/main/examples.md or you can leverage caching with actions/setup-node https://github.com/actions/setup-node
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: 📦 Install Dependencies
       # npm ci instead of npm install to not overwrite package_lock.json
        run: npm install

      - name: Set env
        id: prepare_env # An ID is required to reference its output
        uses: demian-ilnytskyi/workflows/.github/actions/set-nextjs-env@main
        with:
          flavour: ${{ inputs.FLAVOUR }}
          secrets_map: ${{ inputs.secrets_map }}
          set_as_env: ${{ inputs.set_as_env }}
          secrets_json: ${{ toJSON(secrets) }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Build Number
        run: |
          BUILD_NUMBER=$(date +%s)

          mkdir -p public
          echo "{\"BUILD_ID\": \"$BUILD_NUMBER\"}" > "public/config.json"
        shell: bash
          
      - name: Deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLAVOUR: ${{ inputs.FLAVOUR }}
          MAX_SIZE_MB: ${{ inputs.folder_max_mb_size }}
        run: |
              WRANGLER_ENV="$FLAVOUR"
              [[ -n "$SUB_FLAVOUR" ]] && WRANGLER_ENV="${SUB_FLAVOUR}-${FLAVOUR}"
              [[ "$WRANGLER_ENV" != "production" ]] && export CLOUDFLARE_ENV="$WRANGLER_ENV"

              npm run pre-deploy

              echo "🔍 Running the 'check-size' script from package.json..."
              OUTPUT=$(npm run check-size 2>&1)

              echo "📄 Capturing output from 'check-size'..."
              echo "$OUTPUT"

              # Extract the gzipped size in KiB
              GZIP_SIZE_KIB=$(echo "$OUTPUT" | grep "Total Upload:" | grep "gzip:" | awk '{print $7}')

              # Ensure extraction was successful
              if [[ -z "$GZIP_SIZE_KIB" ]]; then
                echo "⚠️  Failed to extract gzipped size. Please check the script output format."
                exit 1
              fi

              echo "📊 Gzipped size extracted: ${GZIP_SIZE_KIB} KiB"

              # Convert KiB to MB (approximation)
              GZIP_SIZE_MB=$(echo "scale=2; $GZIP_SIZE_KIB / 1024" | bc)
              echo "📏 Converted gzipped size: ${GZIP_SIZE_MB} MB"

              # Ensure MAX_SIZE_MB is set (default to 3MB)
              MAX_SIZE_MB=${MAX_APP_SIZE_MB:-3}
              echo "🔎 Max allowed gzipped size: ${MAX_SIZE_MB} MB"

              # Compare gzipped size with max allowed size
              if (( $(echo "$GZIP_SIZE_MB > $MAX_SIZE_MB" | bc -l) )); then
                echo "🚨❌ Gzipped build size exceeds ${MAX_SIZE_MB}MB limit!"
                echo "🛑 Deployment aborted to prevent oversized uploads."
                exit 1
              else
                echo "✅ Gzipped build size is within the limit: ${GZIP_SIZE_MB}MB."
                echo "🚀 Proceeding with deployment..."
              fi

              WRANGLER_ENV="$FLAVOUR"
              [[ -n "$SUB_FLAVOUR" ]] && WRANGLER_ENV="${SUB_FLAVOUR}-${FLAVOUR}"
              ENV_FLAG=""
              [[ "$WRANGLER_ENV" != "production" ]] && ENV_FLAG="--env $WRANGLER_ENV"
              # accountId param falls back to the pipeline variable when empty (mirrors GH `inputs.accountId || secrets.CLOUDFLARE_ACCOUNT_ID`)
              export CLOUDFLARE_ACCOUNT_ID="${ACCOUNT_ID_PARAM:-$CLOUDFLARE_ACCOUNT_ID}"
              check_required_var() {
                  local var_name="$1"
                  local var_value="$2"
                  if [ -z "$var_value" ]; then
                      echo "Error: $var_name is EMPTY or NOT set! Add it to the pipeline variable group or pass accountId."
                      exit 1
                  fi
                  case "$var_value" in
                      '$('*')' )
                          echo "Error: $var_name did not resolve (still literal '$var_value'). It is missing from the pipeline variable group linked to this job."
                          exit 1
                          ;;
                  esac
              }
              check_required_var "CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_ACCOUNT_ID"
              # vinext pre-bundles the worker and emits its own deploy config
              # (main=index.js, no_bundle=true, assets=../client) with the
              # environment already resolved via CLOUDFLARE_ENV. Deploying the
              # root wrangler.toml instead re-bundles and breaks routing.
              if [[ -f dist/server/wrangler.json ]]; then
                unset CLOUDFLARE_ENV
                DEPLOY_OUTPUT=$(npx wrangler deploy -c dist/server/wrangler.json 2>&1)
                echo "$DEPLOY_OUTPUT"
                VERSION_ID=$(echo "$DEPLOY_OUTPUT" | grep "Current Version ID:" | awk '{print $NF}')
                if [[ -n "$VERSION_ID" ]]; then
                  echo "Promoting Version $VERSION_ID to 100% traffic..."
                  npx wrangler versions deploy "${VERSION_ID}@100%" -c dist/server/wrangler.json --yes || true
                fi
              else
                npx wrangler deploy $ENV_FLAG
              fi
  notify:
    if: always() # Ensures this job runs regardless of the completion status of dependent jobs
    needs:
      - build
    uses: ./.github/workflows/notification.yml
    secrets: inherit
    with:
      job_status: ${{ needs.build.result }}
      workflow: ${{ github.workflow }}
      runs_on: ${{inputs.runs_on}}
