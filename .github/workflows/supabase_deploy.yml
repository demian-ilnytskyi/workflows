name: Deploy Supabase Functions

permissions:
  id-token: write # This is required for requesting the JWT
  contents: write # This is required for actions/checkout 

on:
  workflow_call:
    inputs:
      FLAVOUR:
        required: false
        type: string
      runs_on:
        required: false
        type: string
        default: "ubuntu-latest"
      supabase_dir:
        required: false
        type: string
        default: "."
      deploy_db:
        description: 'Deploy Database Migrations?'
        type: boolean
        default: true
      deploy_functions:
        description: 'Deploy Edge Functions?'
        type: boolean
        default: true
      send_notifications:
        description: 'Set to true to send Slack notifications'
        required: false
        type: boolean
        default: true
      no_verify_jwt:
        description: 'Skip JWT verification for supabase functions deploy'
        required: false
        type: boolean
        default: false
      include_all:
        description: 'Include all migrations (equivalent to --include-all for db push)'
        required: false
        type: boolean
        default: false
      DATABASE_DIR:
        description: 'Path to database schema folder'
        required: false
        type: string
        default: 'supabase/data-base'
      MIGRATIONS_DIR:
        description: 'Path to database migrations folder'
        required: false
        type: string
        default: 'supabase/migrations'

jobs:
  deploy:
    runs-on: ${{inputs.runs_on}}
    environment: ${{inputs.FLAVOUR}} 
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DIR: ${{inputs.supabase_dir}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Use the build-in token
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Resolve Supabase Project ID
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ] && [ -n "$SUPABASE_URL" ]; then
            DERIVED_ID=$(echo "$SUPABASE_URL" | sed -E 's#^https?://##; s#\.supabase\.co.*##')
            if [ -n "$DERIVED_ID" ]; then
              echo "SUPABASE_PROJECT_ID=$DERIVED_ID" >> "$GITHUB_ENV"
              echo "Derived SUPABASE_PROJECT_ID from SUPABASE_URL."
            fi
          fi

      - name: Generate Migrations from Data-Base
        run: |
          DATABASE_DIR="${{ inputs.DATABASE_DIR }}"
          MIGRATIONS_DIR="${{ inputs.MIGRATIONS_DIR }}"
          
          if [ ! -d "$DATABASE_DIR" ]; then
              echo "Database directory $DATABASE_DIR does not exist. Skipping."
              exit 0
          fi
          
          mkdir -p "$MIGRATIONS_DIR"
          
          temp_list=$(mktemp)
          
          gather_files_recursive() {
              local target="$1"
              
              if [ -f "$target" ]; then
                  if [[ "$target" == *.sql ]]; then
                      local basename_f
                      basename_f=$(basename "$target")
                      
                      local rel_path="${target#$DATABASE_DIR/}"
                      local category_name="${rel_path%%/*}"
                      local prefix="50"
                      case "$category_name" in
                          types) prefix="10" ;;
                          tables) prefix="20" ;;
                          rpcs) prefix="30" ;;
                          triggers) prefix="40" ;;
                      esac
                      
                      local git_date=""
                      local file_ts
                      file_ts=$(grep -oE "^-- *[0-9]{14}" "$target" | head -n 1 | grep -oE "[0-9]{14}" || true)
                      if [ -n "$file_ts" ]; then
                          git_date="$file_ts"
                      elif [[ "$basename_f" =~ ^[0-9]{14} ]]; then
                          git_date="${BASH_REMATCH[0]}"
                      else
                          # Use git last-modified date/time in YYYYMMDDHHMMSS format
                          git_date=$(git log -1 --format="%ad" --date=format:"%Y%m%d%H%M%S" -- "$target" 2>/dev/null)
                          if [ -z "$git_date" ]; then
                              git_date=$(date +"%Y%m%d%H%M%S")
                          fi
                      fi
                      echo "$git_date|$prefix|$category_name|$target|$basename_f" >> "$temp_list"
                  fi
              elif [ -d "$target" ]; then
                  local items
                  items=$(find "$target" -mindepth 1 -maxdepth 1 | sort)
                  for item in $items; do
                      gather_files_recursive "$item"
                  done
              fi
          }
          
          gather_files_recursive "$DATABASE_DIR"
          
          sorted_list=$(mktemp)
          sort -t'|' -k2,2n -k1,1 -k5,5 "$temp_list" > "$sorted_list"
          
          declare -A USED_TIMESTAMPS
          
          while IFS='|' read -r mtime prefix ftype src_path basename_f; do
              current_time="$mtime"
              while [[ -n "${USED_TIMESTAMPS[$current_time]:-}" ]]; do
                  suffix=$((10#${current_time:8} + 1))
                  current_time="${current_time:0:8}$(printf "%06d" "$suffix")"
              done
              USED_TIMESTAMPS[$current_time]=1
              
              dest_path="$MIGRATIONS_DIR/${current_time}_${basename_f}"
              cp "$src_path" "$dest_path"
              echo "Generated migration: $(basename "$dest_path")"
          done < "$sorted_list"
          
          rm -f "$temp_list" "$sorted_list"

      - name: Clean migrations
        run: |
          SUPABASE_DIR="${{ inputs.supabase_dir }}"
          MIGRATIONS_PATH="$SUPABASE_DIR/supabase/migrations/*.sql"
          echo "🧹 Cleaning Supabase migrations in $SUPABASE_DIR..."
          if ls $MIGRATIONS_PATH >/dev/null 2>&1; then
            echo "🧹 Emptying set up migrations matching *_set_up.sql..."
            find "$SUPABASE_DIR/supabase/migrations" -name "*_set_up.sql" -exec sh -c 'for f; do : > "$f"; done' _ {} +
            # We use perl for faster multiline/multi-file processing without sed -i issues
            find "$SUPABASE_DIR/supabase/migrations" -name "*.sql" -exec perl -pi -e 's/.*objects_delete_delete_prefix.*\n?//g' {} +
            find "$SUPABASE_DIR/supabase/migrations" -name "*.sql" -exec perl -pi -e 's/.*objects_insert_create_prefix.*\n?//g' {} +
            find "$SUPABASE_DIR/supabase/migrations" -name "*.sql" -exec perl -pi -e 's/.*objects_update_create_prefix.*\n?//g' {} +
            find "$SUPABASE_DIR/supabase/migrations" -name "*.sql" -exec perl -pi -e 's/.*prefixes_create_hierarchy.*\n?//g' {} +
            find "$SUPABASE_DIR/supabase/migrations" -name "*.sql" -exec perl -pi -e 's/.*prefixes_delete_hierarchy.*\n?//g' {} +
            find "$SUPABASE_DIR/supabase/migrations" -name "*.sql" -exec perl -pi -e 's/.*hypopg.*\n?//g' {} +
            find "$SUPABASE_DIR/supabase/migrations" -name "*.sql" -exec perl -pi -e 's/.*index_advisor.*\n?//g' {} +
            echo "✅ Migrations cleaned from system junk"
          else
            echo "⏭️ No migration files found to clean."
          fi

      - name: Deploy Database Migrations
        if: github.event_name == 'push' || inputs.deploy_db == true
        run: |
          echo "🔍 Running deployment diagnostics..."
          echo "Project ID length: ${#SUPABASE_PROJECT_ID}"
          echo "DB Password length: ${#SUPABASE_DB_PASSWORD}"
          if [ ${#SUPABASE_DB_PASSWORD} -eq 0 ]; then
              echo "❌ Error: SUPABASE_DB_PASSWORD secret is EMPTY or NOT set!"
          fi
          
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" || echo "Link warned..."
          
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
              echo "🧹 Cleaning up invalid/old migration records from remote schema_migrations..."
              supabase db query "DELETE FROM supabase_migrations.schema_migrations WHERE length(version) != 14;" --linked || echo "Remote cleanup warning..."
          fi
          # repair_supabase_migrations.sh content
          YELLOW='\033[0;33m'
          GREEN='\033[0;32m'
          RED='\033[0;31m'
          NC='\033[0m'
          INCLUDE_ALL_FLAG=""
          if [ "${{ inputs.include_all }}" = "true" ]; then
              INCLUDE_ALL_FLAG="--include-all"
          fi
          echo -e "${YELLOW}🚀 Attempting to push migrations and repair history drifts...${NC}"
          OUTPUT_FILE=$(mktemp)
          set +e
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
              yes | supabase db push $INCLUDE_ALL_FLAG --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee "$OUTPUT_FILE"
          else
              yes | supabase db push $INCLUDE_ALL_FLAG 2>&1 | tee "$OUTPUT_FILE"
          fi
          PUSH_STATUS=${PIPESTATUS[1]}
          set -e
          if [ $PUSH_STATUS -eq 0 ]; then
              echo -e "${GREEN}✅ Successfully pushed migrations without repairs.${NC}"
              rm "$OUTPUT_FILE"
          elif grep -q "Remote migration versions not found" "$OUTPUT_FILE"; then
              echo ""
              echo -e "${YELLOW}⚠️ Mismatch detected! Dynamically repairing missing remote migrations...${NC}"
              MISSING_VERSIONS=$(grep -oE "reverted [0-9 ]+" "$OUTPUT_FILE" | head -n 1 | sed 's/reverted //')
              if [ ! -z "$MISSING_VERSIONS" ]; then
                  echo -e "🛠 Force repairing versions: $MISSING_VERSIONS to 'reverted'..."
                  if [ -n "$SUPABASE_DB_PASSWORD" ]; then
                      supabase migration repair --status reverted $MISSING_VERSIONS --password "$SUPABASE_DB_PASSWORD"
                      echo -e "${YELLOW}🔄 Retrying db push...${NC}"
                      yes | supabase db push $INCLUDE_ALL_FLAG --password "$SUPABASE_DB_PASSWORD"
                  else
                      supabase migration repair --status reverted $MISSING_VERSIONS
                      echo -e "${YELLOW}🔄 Retrying db push...${NC}"
                      yes | supabase db push $INCLUDE_ALL_FLAG
                  fi
                  echo -e "${GREEN}✅ Successfully repaired and pushed migrations!${NC}"
                  rm "$OUTPUT_FILE"
              else
                  echo -e "${RED}❌ Mismatch detected, but could not extract version IDs.${NC}"
                  rm "$OUTPUT_FILE"
                  exit 1
              fi
          else
              echo -e "${RED}❌ Push failed for reasons other than a version mismatch.${NC}"
              echo -e "${RED}--- Supabase db push output ---${NC}"
              cat "$OUTPUT_FILE"
              rm "$OUTPUT_FILE"
              exit $PUSH_STATUS
          fi

      - name: Deploy all Edge Functions
        if: github.event_name == 'push' || inputs.deploy_functions == true
        run: |
          JWT_FLAG=""
          if [ "${{ inputs.no_verify_jwt }}" = "true" ]; then
              JWT_FLAG="--no-verify-jwt"
          fi
          supabase functions deploy $JWT_FLAG --project-ref "$SUPABASE_PROJECT_ID"
  notify:
    if: always() && inputs.send_notifications == true
    needs:
      - deploy
    uses: ./.github/workflows/notification.yml
    secrets: inherit
    with:
      job_status: ${{ needs.deploy.result }}
      workflow: ${{ github.workflow }}
      runs_on: ${{inputs.runs_on}}
