name: Deploy Supabase Functions

permissions:
  id-token: write # This is required for requesting the JWT
  contents: write # This is required for actions/checkout 

on:
  workflow_call:
    inputs:
      FLAVOUR:
        required: false
        type: string
      runs_on:
        required: false
        type: string
        default: "ubuntu-latest"
      supabase_dir:
        required: false
        type: string
        default: "."
      deploy_db:
        description: 'Deploy Database Migrations?'
        type: boolean
        default: true
      deploy_functions:
        description: 'Deploy Edge Functions?'
        type: boolean
        default: true
      send_notifications:
        description: 'Set to true to send Slack notifications'
        required: false
        type: boolean
        default: true
      no_verify_jwt:
        description: 'Skip JWT verification for supabase functions deploy'
        required: false
        type: boolean
        default: false
      DATABASE_DIR:
        description: 'Path to database schema folder'
        required: false
        type: string
        default: 'supabase/data-base'
      MIGRATIONS_DIR:
        description: 'Path to database migrations folder'
        required: false
        type: string
        default: 'supabase/migrations'

jobs:
  deploy:
    runs-on: ${{inputs.runs_on}}
    environment: ${{inputs.FLAVOUR}} 
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_POOLER_REGION: ${{ secrets.SUPABASE_POOLER_REGION }}
      SUPABASE_DIR: ${{inputs.supabase_dir}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Use the build-in token
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Resolve Supabase Project ID
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ] && [ -n "$SUPABASE_URL" ]; then
            DERIVED_ID=$(echo "$SUPABASE_URL" | sed -E 's#^https?://##; s#\.supabase\.co.*##')
            if [ -n "$DERIVED_ID" ]; then
              echo "SUPABASE_PROJECT_ID=$DERIVED_ID" >> "$GITHUB_ENV"
              echo "Derived SUPABASE_PROJECT_ID from SUPABASE_URL."
            fi
          fi

      - name: Check required secrets (database)
        if: github.event_name == 'push' || inputs.deploy_db == true
        uses: demian-ilnytskyi/workflows/.github/actions/check-required-vars@main
        with:
          vars: |
            SUPABASE_PROJECT_ID
            SUPABASE_DB_PASSWORD
            SUPABASE_POOLER_REGION

      - name: Check required secrets (functions)
        if: github.event_name == 'push' || inputs.deploy_functions == true
        uses: demian-ilnytskyi/workflows/.github/actions/check-required-vars@main
        with:
          vars: |
            SUPABASE_PROJECT_ID
            SUPABASE_ACCESS_TOKEN

      - name: Generate Migrations from Data-Base
        env:
          DATABASE_DIR_IN: ${{ inputs.DATABASE_DIR }}
          MIGRATIONS_DIR_IN: ${{ inputs.MIGRATIONS_DIR }}
        run: |
          DATABASE_DIR="$DATABASE_DIR_IN"
          MIGRATIONS_DIR="$MIGRATIONS_DIR_IN"

          if [ ! -d "$DATABASE_DIR" ]; then
              echo "Database directory $DATABASE_DIR does not exist. Skipping."
              exit 0
          fi

          mkdir -p "$MIGRATIONS_DIR"
          find "$MIGRATIONS_DIR" -maxdepth 1 -name '*.sql' -delete

          temp_list=$(mktemp)

          declare -A CATEGORY_PREFIX
          order_file="$DATABASE_DIR/order.txt"
          prefix_counter=10
          if [ -f "$order_file" ]; then
              while IFS= read -r line || [ -n "$line" ]; do
                  line=$(echo "$line" | tr -d '\r' | xargs)
                  if [ -n "$line" ] && [ "${line:0:1}" != "#" ]; then
                      CATEGORY_PREFIX["$line"]=$prefix_counter
                      prefix_counter=$((prefix_counter + 10))
                  fi
              done < "$order_file"
          fi

          declare -A FILE_ORDER

          load_file_order() {
              local dir="$1"
              local file_order_file="$dir/order.txt"
              local i=10
              if [ -f "$file_order_file" ]; then
                  while IFS= read -r line || [ -n "$line" ]; do
                      line=$(echo "$line" | tr -d '\r' | xargs)
                      if [ -n "$line" ] && [ "${line:0:1}" != "#" ]; then
                          FILE_ORDER["$dir/$line"]=$i
                          i=$((i + 10))
                      fi
                  done < "$file_order_file"
              fi
          }

          gather_files_recursive() {
              local target="$1"

              if [ -f "$target" ]; then
                  if [[ "$target" == *.sql ]]; then
                      local basename_f
                      basename_f=$(basename "$target")
                      echo "Scanning: $target"

                      local rel_path="${target#$DATABASE_DIR/}"
                      local category_name="${rel_path%%/*}"
                      local prefix="${CATEGORY_PREFIX[$category_name]:-99}"
                      local file_order="${FILE_ORDER[$target]:-9999}"

                      local git_date=""
                      local file_ts
                      file_ts=$(grep -oE "^-- *[0-9]{14}" "$target" | head -n 1 | grep -oE "[0-9]{14}" || true)
                      if [ -n "$file_ts" ]; then
                          git_date="$file_ts"
                      elif [[ "$basename_f" =~ ^[0-9]{14} ]]; then
                          git_date="${BASH_REMATCH[0]}"
                      else
                          git_date="00000000000000"
                      fi
                      echo "$git_date|$prefix|$file_order|$category_name|$target|$basename_f" >> "$temp_list"
                  fi
              elif [ -d "$target" ]; then
                  if [ "$(basename "$target")" = "ci" ]; then
                      echo "Skipping CI-only directory: $target"
                      return
                  fi
                  load_file_order "$target"
                  local items
                  items=$(find "$target" -mindepth 1 -maxdepth 1 | sort)
                  for item in $items; do
                      gather_files_recursive "$item"
                  done
              fi
          }

          echo "Scanning $DATABASE_DIR for migration source files..."
          gather_files_recursive "$DATABASE_DIR"
          echo "Scan complete."

          sorted_list=$(mktemp)
          sort -t'|' -k2,2n -k3,3n -k1,1 -k6,6 "$temp_list" > "$sorted_list"

          declare -A USED_TIMESTAMPS
          base_time=$(date +"%Y%m%d%H%M%S")

          while IFS='|' read -r mtime prefix file_order ftype src_path basename_f; do
              current_time="$base_time"
              while [[ -n "${USED_TIMESTAMPS[$current_time]:-}" ]]; do
                  suffix=$((10#${current_time:8} + 1))
                  current_time="${current_time:0:8}$(printf "%06d" "$suffix")"
              done
              USED_TIMESTAMPS[$current_time]=1

              dest_path="$MIGRATIONS_DIR/${current_time}_${basename_f}"
              cp "$src_path" "$dest_path"
              echo "Generated migration: $(basename "$dest_path")"
          done < "$sorted_list"

          rm -f "$temp_list" "$sorted_list"

          echo "=== Final migrations directory contents (sorted) ==="
          ls -1 "$MIGRATIONS_DIR" | sort
          echo "=== End migrations directory listing ==="

      - name: Clean migrations
        env:
          SUPABASE_DIR_IN: ${{ inputs.supabase_dir }}
        run: |
          SUPABASE_DIR="$SUPABASE_DIR_IN"
          MIGRATIONS_PATH="$SUPABASE_DIR/supabase/migrations/*.sql"
          echo "Cleaning Supabase migrations in $SUPABASE_DIR..."
          if ls $MIGRATIONS_PATH >/dev/null 2>&1; then
            echo "Emptying set up migrations matching *_set_up.sql..."
            find "$SUPABASE_DIR/supabase/migrations" -name "*_set_up.sql" -exec sh -c 'for f; do : > "$f"; done' _ {} +
            # We use perl for faster multiline/multi-file processing without sed -i issues
            find "$SUPABASE_DIR/supabase/migrations" -name "*.sql" -exec perl -pi -e 's/.*objects_delete_delete_prefix.*\n?//g' {} +
            find "$SUPABASE_DIR/supabase/migrations" -name "*.sql" -exec perl -pi -e 's/.*objects_insert_create_prefix.*\n?//g' {} +
            find "$SUPABASE_DIR/supabase/migrations" -name "*.sql" -exec perl -pi -e 's/.*objects_update_create_prefix.*\n?//g' {} +
            find "$SUPABASE_DIR/supabase/migrations" -name "*.sql" -exec perl -pi -e 's/.*prefixes_create_hierarchy.*\n?//g' {} +
            find "$SUPABASE_DIR/supabase/migrations" -name "*.sql" -exec perl -pi -e 's/.*prefixes_delete_hierarchy.*\n?//g' {} +
            find "$SUPABASE_DIR/supabase/migrations" -name "*.sql" -exec perl -pi -e 's/.*hypopg.*\n?//g' {} +
            find "$SUPABASE_DIR/supabase/migrations" -name "*.sql" -exec perl -pi -e 's/.*index_advisor.*\n?//g' {} +
            echo "Migrations cleaned from system junk"
          else
            echo "No migration files found to clean."
          fi

      - name: Install psql
        if: github.event_name == 'push' || inputs.deploy_db == true
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Deploy Database Migrations
        if: github.event_name == 'push' || inputs.deploy_db == true
        env:
          MIGRATIONS_DIR: ${{ inputs.MIGRATIONS_DIR }}
        run: |
          set -e
          DB_URL="postgresql://postgres.${SUPABASE_PROJECT_ID}:${SUPABASE_DB_PASSWORD}@aws-0-${SUPABASE_POOLER_REGION}.pooler.supabase.com:5432/postgres"

          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE IF NOT EXISTS supabase_migrations.migrations_history (
              content_hash text PRIMARY KEY,
              name text NOT NULL,
              created_at timestamptz NOT NULL DEFAULT now()
            );
            ALTER TABLE supabase_migrations.migrations_history
              ADD COLUMN IF NOT EXISTS updated_at timestamptz NOT NULL DEFAULT now();
            CREATE OR REPLACE FUNCTION supabase_migrations.trigger_set_timestamp()
            RETURNS TRIGGER AS \$\$
            BEGIN
              IF NEW.updated_at IS NOT DISTINCT FROM OLD.updated_at THEN
                NEW.updated_at := CURRENT_TIMESTAMP;
              END IF;
              RETURN NEW;
            END;
            \$\$ LANGUAGE plpgsql;
            DROP TRIGGER IF EXISTS set_timestamp ON supabase_migrations.migrations_history;
            CREATE TRIGGER set_timestamp
              BEFORE UPDATE ON supabase_migrations.migrations_history
              FOR EACH ROW EXECUTE FUNCTION supabase_migrations.trigger_set_timestamp();
            CREATE OR REPLACE FUNCTION supabase_migrations.missing_indexes(hashes text[])
            RETURNS integer[] AS \$\$
              SELECT coalesce(array_agg(idx), '{}')
              FROM unnest(hashes) WITH ORDINALITY AS h(hash, idx)
              WHERE NOT EXISTS (
                SELECT 1 FROM supabase_migrations.migrations_history a WHERE a.content_hash = h.hash
              );
            \$\$ LANGUAGE sql STABLE;
          "

          YELLOW='\033[0;33m'
          GREEN='\033[0;32m'
          NC='\033[0m'

          FILES=($(ls "$MIGRATIONS_DIR"/*.sql 2>/dev/null | sort))
          HASHES=()
          for f in "${FILES[@]}"; do
              HASHES+=("$(sha256sum "$f" | cut -d' ' -f1)")
          done

          if [ ${#HASHES[@]} -eq 0 ]; then
              echo "No migration files found."
              exit 0
          fi

          HASHES_ARRAY_LITERAL=$(printf '"%s",' "${HASHES[@]}")
          HASHES_ARRAY_LITERAL="{${HASHES_ARRAY_LITERAL%,}}"

          MISSING_INDEXES=$(psql "$DB_URL" -Atq -c "SELECT array_to_string(supabase_migrations.missing_indexes('$HASHES_ARRAY_LITERAL'), ',');")

          IFS=',' read -ra MISSING_IDX_ARR <<< "$MISSING_INDEXES"

          for idx in "${MISSING_IDX_ARR[@]}"; do
              [ -z "$idx" ] && continue
              f="${FILES[$((idx - 1))]}"
              hash="${HASHES[$((idx - 1))]}"
              base=$(basename "$f")
              name=$(echo "$base" | sed -E 's/^[0-9]{14,}_//')

              echo -e "${YELLOW}Applying migration $name...${NC}"
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
              psql "$DB_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO supabase_migrations.migrations_history (content_hash, name) VALUES ('$hash', '$name');"
              echo -e "${GREEN}Applied $name.${NC}"
          done

          echo -e "${GREEN}All migrations applied.${NC}"

      - name: Deploy all Edge Functions
        if: github.event_name == 'push' || inputs.deploy_functions == true
        run: |
          JWT_FLAG=""
          if [ "${{ inputs.no_verify_jwt }}" = "true" ]; then
              JWT_FLAG="--no-verify-jwt"
          fi
          supabase functions deploy $JWT_FLAG --use-api --import-map "$SUPABASE_DIR/supabase/functions/deno.json" --project-ref "$SUPABASE_PROJECT_ID"
  notify:
    if: always() && inputs.send_notifications == true
    needs:
      - deploy
    uses: ./.github/workflows/notification.yml
    secrets: inherit
    with:
      job_status: ${{ needs.deploy.result }}
      workflow: ${{ github.workflow }}
      runs_on: ${{inputs.runs_on}}
